name: Build Simple Planes 26.2 Port
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: bash ./gradlew build --stacktrace --no-daemon
      - name: Upload output when successful
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simple-planes-build
          path: build/libs/*.jar
